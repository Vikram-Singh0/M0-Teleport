[profile.default]
remappings = [
  "forge-std/=lib/forge-std/src",
  "common/=lib/m-extensions/lib/common/src",
  "openzeppelin-foundry-upgrades/=lib/m-extensions/lib/openzeppelin-foundry-upgrades/src",
]
no_git = true
offline = true
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
